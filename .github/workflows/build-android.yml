name: Battle Zone Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    name: Build Battle Zone APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Install Godot Android export templates
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 5 -o /tmp/godot_templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_debug.apk' -d "$TEMPLATE_DIR"
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_release.apk' -d "$TEMPLATE_DIR"
          printf '%s.stable\n' "$GODOT_VERSION" > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          adb version
          adb kill-server || true
          adb start-server
          adb devices

      - name: Configure Godot Android export
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/adb = \"$ANDROID_HOME/platform-tools/adb\"" \
            "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/shutdown_adb_on_exit = false' \
            > "$HOME/.config/godot/editor_settings-4.tres"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$HOME/.android/debug.keystore"

      - name: Verify Godot project
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Verify Android export configuration
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          adb kill-server || true
          adb start-server
          adb devices
          godot --headless --path . --export-debug "Android" /tmp/BattleZoneConfigurationCheck.apk
          test -s /tmp/BattleZoneConfigurationCheck.apk
          rm -f /tmp/BattleZoneConfigurationCheck.apk

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          adb kill-server || true
          adb start-server
          adb devices
          rm -rf build
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BattleZoneOffline.apk
          test -s build/BattleZoneOffline.apk
          ls -lh build/BattleZoneOffline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleZoneOffline-APK
          path: build/BattleZoneOffline.apk
          if-no-files-found: error
