name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Install Godot Android export templates
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -L --fail --retry 3 \
            -o /tmp/godot_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_debug.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_release.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          test -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Godot project and export configuration
        run: |
          set -e
          godot --headless --path . --editor --quit
          echo "--- Export preset ---"
          cat export_presets.cfg
          echo "--- Installed templates ---"
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Export APK
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BattleRoyaleMobile.apk
          test -s build/BattleRoyaleMobile.apk
          ls -lh build/BattleRoyaleMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyaleMobile-APK
          path: build/BattleRoyaleMobile.apk
          if-no-files-found: error
