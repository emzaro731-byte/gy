name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Install Godot Android export templates
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -L --fail --retry 3 \
            -o /tmp/godot_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_debug.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -o /tmp/godot_templates.tpz 'templates/android_release.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          printf '4.5.1.stable\n' > "$HOME/.local/share/godot/export_templates/4.5.1.stable/version.txt"
          test -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          adb version
          adb start-server
          adb devices

      - name: Configure Godot Android export
        run: |
          set -e
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt 2>/dev/null || true
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/force_system_user = false
export/android/shutdown_adb_on_exit = true
EOF
          echo "--- Godot Android settings ---"
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          echo "--- SDK/JDK ---"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Verify Godot project and export configuration
        run: |
          set -e
          godot --headless --path . --editor --quit
          echo "--- Export preset ---"
          cat export_presets.cfg
          echo "--- Installed templates ---"
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

      - name: Export APK
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BattleRoyaleMobile.apk
          test -s build/BattleRoyaleMobile.apk
          ls -lh build/BattleRoyaleMobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyaleMobile-APK
          path: build/BattleRoyaleMobile.apk
          if-no-files-found: error
